<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      .box{
        margin: 20px;
        width: 500px;
      }
      ul {
     list-style:disc;
     padding-left: 10px;
      }
      li {
  background: #f8f8f8;
  padding: 12px 16px;
  margin-bottom: 8px;
  border-radius: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: 0.2s;}
  li:hover {
  background: #eaeaea;}

  /* li.done {
  text-decoration: line-through;
  opacity: 0.6;} */

  li button {
  background: red;
  color: white;
  border: none;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  cursor: pointer;}

    </style>
</head>
<body>
    
<div class="box">
   <h1>JavaScript Project</h1>
  <h2>To-Do List</h2>
  
  <input id="task" placeholder="New task" autocomplete="off">
  
  <button onclick="addTask()">Add</button>
  
  <ul id="list" style="margin: 20px 0px; color: green;"></ul>
  
  <button onclick="clearAll()">Clear All</button>
  <button onclick="saveTasks(true)">Save</button>
  <p id="message"></p>
</div>

<script>
// Create a task Array
let tasks = [];

document.getElementById("taskInput"),addEventListener("keydown", e =>{
  if(e.key === "Enter"){
   addTask();
  }
})

// Function to Display tasks
function displayTasks() {
  let html = "";
  for (let i = 0; i < tasks.length; i++) {
    html += "<li>" + tasks[i] +
    " <button onclick='removeTask(" + i + ")'>x</button></li>";
  }
  document.getElementById("list").innerHTML = html;
}

// Function to Add a task
function addTask(showMsg = false) {
 const taskInput = document.getElementById("task");
  const text = taskInput.value.trim();
  if (text === "") {
    alert("Please enter a task!")
    return;
  }
  tasks.push(text);
  taskInput.value = "";
  saveTasks();
  displayTasks();
}

// Function to diplay message
const msgEl = document.getElementById("message");
let timer;

function showMessage(text) {
  clearTimeout(timer);
  msgEl.textContent = text;

  timer = setTimeout(() => {
    msgEl.textContent = "";
  }, 1000);
}

// Function to Remove a task
function removeTask(i) {
  tasks.splice(i, 1);
  saveTasks();
  displayTasks();
}

// Function to Clear all tasks
function clearAll() {
  tasks = [];
  saveTasks();
  displayTasks();
}

// Function to Save tasks
function saveTasks(showMsg = false) {
  localStorage.setItem("tasks", JSON.stringify(tasks));
   if (showMsg) {
    showMessage("Saved!");
  }
}

// Function to Load tasks
function loadTasks() {
  let saved = localStorage.getItem("tasks");
  if (saved !== null) {
    tasks = JSON.parse(saved);
  }
}

// Load and display tasks when page loads 
loadTasks();
displayTasks();
</script>



</body>
</html>
